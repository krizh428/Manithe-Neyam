<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Radial Gradient for inner cyan circle -->
    <radialGradient id="cyanGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#A52A2A" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0369A1" />
    </radialGradient>
    <!-- Ochre Gradient for accents -->
    <linearGradient id="ochreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <!-- Circular Path for Tamil Curved Text - Top -->
    <path id="topTextPath" d="M 65,250 A 185,185 0 1,1 435,250" fill="none" />
    <!-- Circular Path for Tamil Curved Text - Bottom -->
    <path id="bottomTextPath" d="M 435,250 A 185,185 0 0,1 65,250" fill="none" />
    <!-- Filter for soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0EA5E9" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Double Cyan Ring -->
  <circle cx="250" cy="250" r="242" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="6" filter="url(#softGlow)" />
  <circle cx="250" cy="250" r="232" fill="none" stroke="#D97706" stroke-width="2.5" />
  
  <!-- Outer Slate Ring for Text -->
  <circle cx="250" cy="250" r="226" fill="#FFFDF9" />
  
  <!-- Inner Cyan Circle -->
  <circle cx="250" cy="250" r="158" fill="url(#cyanGrad)" stroke="#D97706" stroke-width="4" />
  <circle cx="250" cy="250" r="162" fill="none" stroke="#0EA5E9" stroke-width="2" />

  <!-- Outer Text: மனிதநேய ஆதரவற்றோர் காப்பகம் -->
  <text font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-weight="800" font-size="28" fill="#0EA5E9" letter-spacing="1">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
      மனிதநேய ஆதரவற்றோர் காப்பகம்
    </textPath>
  </text>

  <!-- Decorative Stars on sides -->
  <!-- Left Star -->
  <polygon points="48,250 53,238 65,238 55,246 59,258 48,250 37,258 41,246 31,238 43,238" fill="#0EA5E9" />
  <!-- Right Star -->
  <polygon points="452,250 457,238 469,238 459,246 463,258 452,250 441,258 445,246 435,238 447,238" fill="#0EA5E9" />

  <!-- Bottom Text: கோடாங்கிபட்டி, தேனி. -->
  <text font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-weight="800" font-size="26" fill="#0EA5E9" letter-spacing="1.5">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
      கோடாங்கிபட்டி, தேனி.
    </textPath>
  </text>

  <!-- Central Symbol: Warm Protective Caring Hands & Sleeping Baby / Child Silhouette -->
  <!-- Soft central light highlight -->
  <ellipse cx="230" cy="210" rx="90" ry="70" fill="#FFE5D9" opacity="0.3" />

  <!-- Gentle Caring Hands -->
  <g transform="translate(135, 140) scale(0.95)">
    <!-- Base Caring Hands in dark warm charcoal tone with highlights -->
    <path d="M 30,140 C 20,120 40,80 90,95 C 130,105 160,110 200,85 C 215,80 225,95 205,115 C 175,145 130,165 80,160 C 50,158 35,150 30,140 Z" fill="#2B1E1E" opacity="0.95" />
    <path d="M 60,155 C 90,175 140,170 185,135 C 195,127 205,135 190,148 C 150,185 95,190 55,168 Z" fill="#1C1414" />
    
    <!-- Sleeping Baby / Cherished Child nestled gently in the caring palms -->
    <!-- Baby body -->
    <ellipse cx="115" cy="85" rx="55" ry="42" fill="#FFF2EB" transform="rotate(-15 115 85)" />
    <!-- Baby head -->
    <circle cx="75" cy="72" r="32" fill="#FFE8DC" />
    <!-- Gentle facial profile & closed eyes -->
    <path d="M 65,72 Q 72,75 79,72" stroke="#B37D6D" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 72,82 Q 77,85 82,82" stroke="#C48A7A" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 52,65 Q 58,52 75,54" stroke="#9E6B5B" stroke-width="2" fill="none" />
    <!-- Baby little arms curled peacefully -->
    <ellipse cx="98" cy="92" rx="20" ry="12" fill="#FFE0D2" transform="rotate(20 98 92)" />
    <ellipse cx="108" cy="98" rx="10" ry="8" fill="#FFD6C4" />
    <!-- Baby feet curled -->
    <ellipse cx="152" cy="75" rx="14" ry="10" fill="#FFE0D2" transform="rotate(-30 152 75)" />
    <!-- Warm ochreen halo of love & protection -->
    <circle cx="115" cy="80" r="62" fill="none" stroke="#D97706" stroke-width="2" opacity="0.6" stroke-dasharray="4,4" />
  </g>
</svg>
